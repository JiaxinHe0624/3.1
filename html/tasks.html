<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyTrack | Task Manager</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="nav-inner">
            <a class="logo" href="index.html">StudyTrack</a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="tasks.html" class="active">Task Manager</a>
                <a href="blog.html">Project Blog</a>
                <a href="ethics.html">Ethics &amp; Privacy</a>
            </nav>
        </div>
    </header>

    <main class="container">

        <!-- Login gate. Nothing below is visible until tasks.js
             accepts the username and password. -->
        <section class="card login-card" id="loginSection">
            <h2>Sign in</h2>
            <p class="login-hint">Demo account: student / INFO1012</p>

            <form id="loginForm">
                <label for="username">Username</label>
                <input id="username" type="text" autocomplete="username" placeholder="student">

                <label for="password">Password</label>
                <input id="password" type="password" autocomplete="current-password" placeholder="INFO1012">

                <!-- Left empty: JavaScript writes the message here. -->
                <p class="error" id="loginError"></p>

                <button class="btn" type="submit">Sign in</button>
            </form>
        </section>

        <!-- The task area. All of it is hidden until sign in succeeds. -->
        <div id="appSection" class="hidden">

            <h1 class="page-title">My study tasks</h1>
            <button class="btn-outline signout-btn" id="logoutBtn" type="button">Sign out</button>

            <!-- One form does both jobs: adding a new task, and editing
                 an existing one. The heading and button label change
                 to tell the user which mode they are in. -->
            <section class="card">
                <h2 id="formTitle">Add a task</h2>

                <form id="taskForm">
                    <label for="taskTitle">Task title</label>
                    <input id="taskTitle" type="text" placeholder="INFO1012 assignment 3 report">
                    <p class="error" id="titleError"></p>

                    <label for="courseCode">Course code</label>
                    <input id="courseCode" type="text" placeholder="INFO1012">
                    <p class="error" id="courseCodeError"></p>

                    <label for="courseName">Course name</label>
                    <input id="courseName" type="text" placeholder="Information Technology Systems">
                    <p class="error" id="courseNameError"></p>

                    <label for="dueDate">Due date</label>
                    <input id="dueDate" type="date">
                    <p class="error" id="dueDateError"></p>

                    <label for="description">Description</label>
                    <textarea id="description" rows="3" placeholder="What the task involves"></textarea>
                    <p class="error" id="descriptionError"></p>

                    <label for="notes">Extra notes (optional)</label>
                    <textarea id="notes" rows="2" placeholder="Anything else worth remembering"></textarea>

                    <button class="btn" type="submit" id="submitBtn">Add task</button>
                    <button class="btn-outline hidden" id="cancelEditBtn" type="button">Cancel edit</button>
                </form>
            </section>

            <!-- The whole list, sorted by due date. -->
            <section class="card">
                <h2>All tasks</h2>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Course</th>
                                <th>Due</th>
                                <th>Description</th>
                                <th>Notes</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="taskTableBody"></tbody>
                    </table>
                </div>

                <p class="login-hint" id="emptyMessage">No tasks yet. Add the first one above.</p>
            </section>

            <!-- The brief asks for the current date and time at the
                 bottom of the task page. tasks.js keeps it ticking. -->
            <footer class="site-footer">
                <p>Current date and time: <span id="clock"></span></p>
            </footer>

        </div>

    </main>

    <script src="../js/tasks.js"></script>
</body>
</html>
